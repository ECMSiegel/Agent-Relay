name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit suite
        run: python -m unittest discover -s .agents/team/tests -v
      - name: Run multi-agent simulation
        run: python .agents/team/tests/simulate.py --report "$RUNNER_TEMP/agent-coordination-simulation.md"
      - name: Build allowlisted versioned archive
        if: matrix.python-version == '3.12'
        run: python scripts/build_release.py --check-first-commit
      - name: Exercise fresh extracted archive
        if: matrix.python-version == '3.12'
        run: python scripts/smoke_release.py
      - name: Upload reviewable ZIP
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: agent-coordination-v0.2.0
          path: dist/agent-coordination-v0.2.0.zip
          if-no-files-found: error
          retention-days: 14
